# Graystone AI Stores nginx serving configuration
#
# Hugging Face compatibility required by llama.cpp b10612 for the preserved
# Muse Glimmer repository.
#
# Canonical Vault data remains under:
#
#   .../revisions/<revision>/<artifact>
#
# This serving layer provides:
#
#   /api/models/<repo>/refs
#   /api/models/<repo>/tree/<revision>
#   /<repo>/resolve/<revision>/<artifact>
#
# No compatibility symlinks or duplicate artifacts are stored in Vault.

server {
    listen 10.10.10.1:81;
    server_name 10.10.10.1;

    location = /ai-stores/vault/huggingface/api/models/meta-models/Muse-Glimmer-30B-GGUF/refs {
        default_type application/json;
        return 200 '{"branches":[{"name":"main","targetCommit":"70bf1b61ac09f91b24d39038091b41c582bc5d7a"}],"converts":[],"tags":[]}';
    }

    location = /ai-stores/vault/huggingface/api/models/meta-models/Muse-Glimmer-30B-GGUF/tree/70bf1b61ac09f91b24d39038091b41c582bc5d7a {
        default_type application/json;
        return 200 '[{"type":"file","path":"Muse-Glimmer-30B-KQuant-17GB-Q4_K_M.gguf","lfs":{"oid":"4cc57c0f51040a226e5a72cc47b7613f7772950e460a665f7083de89f183f60e"}},{"type":"file","path":"mmproj-Muse-Glimmer-30B-Q4_K_M.gguf","lfs":{"oid":"f48b452316f9b213758e8659444029b961a24a07f99a1abb2a9f88b06f7c00c6"}},{"type":"file","path":"dflash-Muse-Glimmer-30B-Q4_K_M.gguf","lfs":{"oid":"b2e808bf656086fe86bd0d0bd990f01d33e377537a07c02d45371517c8b264ef"}}]';
    }

    location ~ ^/ai-stores/vault/huggingface/(.+)/resolve/([^/]+)/(.*)$ {
        rewrite ^/ai-stores/vault/huggingface/(.+)/resolve/([^/]+)/(.*)$ /ai-stores/vault/huggingface/$1/revisions/$2/$3 last;
    }

    location /ai-stores/ {
        alias /home/nispoe/graystone/ai-stores/;
    }
}
